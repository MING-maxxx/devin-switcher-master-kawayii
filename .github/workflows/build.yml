# 手动运行：仓库页面 Actions -> Build Windows -> Run workflow。
# 编完后在这次运行页面底部的 Artifacts 里下载 devin-switch-windows-x64（两个 exe + SHA256SUMS.txt）。
# 依赖版本严格按 app/Cargo.lock（--locked）；两个官方动作都固定到了提交哈希。
name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Build release binaries
        working-directory: app
        run: cargo build --release --locked --bins --features tauri/custom-protocol

      - name: Collect binaries and SHA-256
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path app/target/release/devin-switch.exe, app/target/release/dsw.exe -Destination dist/
          Get-ChildItem dist/*.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Tee-Object -FilePath dist/SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devin-switch-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests (core logic, no GUI dependencies)
        working-directory: app
        run: cargo test --locked --no-default-features
